command_guard:
  ros__parameters:
    use_sim_time: true
    input_topic: /cmd_vel_safe
    output_topic: /cmd_vel_sim
    status_topic: /control/guard_status
    max_linear_speed: 1.0
    max_angular_speed: 1.2
    max_linear_acceleration: 1.0
    max_linear_deceleration: 1.6
    max_angular_acceleration: 2.0
    max_angular_deceleration: 3.0
    max_linear_jerk: 5.0
    max_angular_jerk: 10.0
    slew_response_rate: 8.0
    command_timeout: 0.25
    update_rate: 100.0
    visual_slam_timeout: 1.0
    depth_timeout: 0.50
    map_slice_timeout: 1.0

wheel_odometry:
  ros__parameters:
    use_sim_time: true
    joint_states_topic: /joint_states
    odometry_topic: /wheel/odometry
    left_wheel_joint: joint_wheel_left
    right_wheel_joint: joint_wheel_right
    wheel_radius: 0.14
    wheel_separation: 0.4132
    odom_frame: odom
    base_frame: base_link
