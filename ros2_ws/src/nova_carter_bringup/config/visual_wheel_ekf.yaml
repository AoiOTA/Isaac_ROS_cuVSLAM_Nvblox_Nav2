visual_wheel_ekf:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.30
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel velocities provide the smooth local odom prediction. cuVSLAM is
    # deliberately not injected as an EKF pose measurement: in a sparse
    # warehouse a foreground mover can dominate a front-only feature set.
    # cuVSLAM still gates navigation health and VGL anchors map->odom, so any
    # loss of visual tracking stops motion instead of allowing blind odometry.
    odom0: /wheel/odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 30
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
    odom0_twist_rejection_threshold: 5.0
