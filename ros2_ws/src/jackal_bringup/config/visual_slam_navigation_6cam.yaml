visual_slam_node:
  ros__parameters:
    use_sim_time: true
    tracking_mode: 1
    # Navigation creates only the front/left/right Hawk publishers. cuVSLAM
    # must declare the same six inputs; declaring eight makes its synchronizer
    # wait forever for the disabled rear pair.
    num_cameras: 6
    min_num_images: 2
    camera_optical_frames:
      - front_stereo_camera_left_optical
      - front_stereo_camera_right_optical
      - left_stereo_camera_left_optical
      - left_stereo_camera_right_optical
      - right_stereo_camera_left_optical
      - right_stereo_camera_right_optical
    imu_frame: front_stereo_camera_imu
    base_frame: base_link
    map_frame: map
    odom_frame: odom
    rectified_images: true
    enable_image_denoising: false
    enable_localization_n_mapping: true
    multicam_mode: 1
    sync_matching_threshold_ms: 40.0
    # With Isaac Sim GUI and RViz active on one RTX 4090, the 10 Hz render
    # streams can arrive 200--400 ms apart in wall-clock time.  This threshold
    # is navigation-only and keeps those measured gaps from resetting tracking.
    image_jitter_threshold_ms: 501.0
    imu_jitter_threshold_ms: 10.0
    image_buffer_size: 160
    imu_buffer_size: 400
    # Match the reliable Isaac camera publishers. Dropping any one member of
    # the six-image set breaks multi-camera synchronization and tracking.
    image_qos: DEFAULT
    imu_qos: SENSOR_DATA
    gyro_noise_density: 0.000244
    gyro_random_walk: 0.000019393
    accel_noise_density: 0.001862
    accel_random_walk: 0.003
    # Must match the 60 Hz physics-step IMU publisher in Isaac Sim.
    calibration_frequency: 60.0
    publish_map_to_odom_tf: true
    publish_odom_to_base_tf: true
    invert_map_to_odom_tf: false
    invert_odom_to_base_tf: false
    override_publishing_stamp: false
    enable_ground_constraint_in_odometry: true
    enable_ground_constraint_in_slam: true
    # Match the capacity used to create the saved four-Hawk map.
    slam_max_map_size: 4000
    slam_throttling_time_ms: 500
    save_map_folder_path: ""
    load_map_folder_path: ""
    localize_on_startup: false
    enable_slam_visualization: false
    enable_observations_view: false
    enable_landmarks_view: false
    path_max_size: 10000
    verbosity: 1
