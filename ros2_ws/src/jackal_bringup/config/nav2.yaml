map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /visual_slam/tracking/odometry
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 5000
    action_server_result_timeout: 300.0
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    error_code_names: [compute_path_error_code, follow_path_error_code, spin_error_code]

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    costmap_update_timeout: 3.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.10
      required_movement_angle: 0.15
      movement_time_allowance: 25.0
    goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.174532925
      trans_stopped_velocity: 0.04
      rot_stopped_velocity: 0.06
      stateful: true
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 20
      model_dt: 0.10
      batch_size: 500
      iteration_count: 1
      ax_max: 1.1
      ax_min: -1.0
      ay_max: 0.0
      ay_min: 0.0
      az_max: 3.0
      vx_std: 0.35
      vy_std: 0.0
      wz_std: 0.80
      vx_max: 0.75
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.20
      prune_distance: 1.5
      transform_tolerance: 0.50
      temperature: 0.30
      gamma: 0.015
      motion_model: DiffDrive
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic,
        PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        # Give obstacle clearance priority over strict adherence to the global
        # path.  Static session-layer obstacles are discovered online, so the
        # initial global path can legitimately run through their footprint.
        cost_weight: 2.0
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 1
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.6
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.40
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 8
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 9.0
        offset_from_furthest: 10
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 9.5
        offset_from_furthest: 8
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.45
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 12.0
      publish_frequency: 8.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.30
      footprint: "[[0.255, 0.210], [0.255, -0.210], [-0.230, -0.210], [-0.230, 0.210]]"
      # A 30 mm shell covers half-cell occupancy quantization at 0.05 m and
      # keeps the physical wheel envelope outside mapped chair geometry.
      footprint_padding: 0.030
      track_unknown_space: true
      always_send_full_costmap: true
      # The saved eight-stream occupancy map supplies 360-degree static
      # context. Front depth/nvblox then add live geometry; without this layer
      # MPPI can clip mapped furniture after it rotates outside the front Hawk.
      plugins: [static_layer, nvblox_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      nvblox_layer:
        plugin: nvblox::nav2::NvbloxCostmapLayer
        enabled: true
        nav2_costmap_global_frame: odom
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        convert_to_binary_costmap: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # Keep the observation in its real optical sensor frame so Nav2 can
        # transform both the points and the ray-tracing origin with TF.  A
        # PointCloud2 pre-transformed into odom has no sensor-origin field;
        # treating odom (0,0) as the origin works near startup but breaks
        # clearing after long-distance motion.
        observation_sources: depth_scan
        depth_scan:
          topic: /front_depth/scan
          data_type: LaserScan
          clearing: true
          marking: true
          observation_persistence: 0.35
          expected_update_rate: 10.0
          obstacle_min_range: 0.15
          obstacle_max_range: 5.0
          raytrace_min_range: 0.0
          raytrace_max_range: 6.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.40
        cost_scaling_factor: 8.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 4.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.30
      resolution: 0.05
      footprint: "[[0.255, 0.210], [0.255, -0.210], [-0.230, -0.210], [-0.230, 0.210]]"
      footprint_padding: 0.030
      # The visual mapping route leaves small unobserved islands around the
      # robot spawn.  Treat those as globally traversable; the rolling local
      # costmap, combined nvblox ESDF and raw-depth Collision Monitor still
      # provide conservative online obstacle enforcement.
      track_unknown_space: false
      always_send_full_costmap: true
      # Front depth observations make the static session-layer objects visible
      # to Smac as soon as they enter view.  The default replan BT can then
      # select a route around them instead of leaving all avoidance to MPPI.
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: depth_scan
        depth_scan:
          topic: /front_depth/scan
          data_type: LaserScan
          clearing: true
          marking: true
          observation_persistence: 0.50
          expected_update_rate: 10.0
          obstacle_min_range: 0.15
          obstacle_max_range: 5.0
          raytrace_min_range: 0.0
          raytrace_max_range: 6.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.40
        cost_scaling_factor: 8.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.10
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 1.2
      use_final_approach_orientation: false
      smooth_path: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Navigation is forward-only: no BackUp or translational recovery action
    # is loaded. Recovery may clear costmaps, rotate in place, or wait.
    behavior_plugins: [spin, wait]
    spin:
      plugin: nav2_behaviors::Spin
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.20
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.25
    rotational_acc_lim: 3.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: true
    action_server_result_timeout: 300.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 100

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity: [0.75, 0.0, 1.20]
    min_velocity: [0.0, 0.0, -1.20]
    max_accel: [1.10, 0.0, 3.00]
    max_decel: [-1.00, 0.0, -3.00]
    odom_topic: /visual_slam/tracking/odometry
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.0, 0.01]
    velocity_timeout: 0.25

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enabled: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_safe
    state_topic: /collision_monitor/state
    transform_tolerance: 0.20
    source_timeout: 0.75
    base_shift_correction: false
    stop_pub_timeout: 0.50
    polygons: [StopZone, SlowdownZone, FootprintApproach]
    StopZone:
      type: polygon
      points: "[[0.285, 0.230], [0.285, -0.230], [-0.250, -0.230], [-0.250, 0.230]]"
      action_type: stop
      min_points: 4
      visualize: true
      polygon_pub_topic: /collision_monitor/stop_zone
      enabled: true
    SlowdownZone:
      type: polygon
      points: "[[0.420, 0.235], [0.420, -0.235], [-0.350, -0.235], [-0.350, 0.235]]"
      action_type: slowdown
      min_points: 4
      slowdown_ratio: 0.85
      visualize: true
      polygon_pub_topic: /collision_monitor/slowdown_zone
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.0
      simulation_time_step: 0.05
      min_points: 4
      visualize: true
      polygon_pub_topic: /collision_monitor/approach_zone
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /front_depth/scan_raw
      enabled: true
