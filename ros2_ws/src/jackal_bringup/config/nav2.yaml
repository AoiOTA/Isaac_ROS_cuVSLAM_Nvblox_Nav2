map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /wheel/odometry
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 5000
    action_server_result_timeout: 300.0
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    error_code_names: [compute_path_error_code, follow_path_error_code, spin_error_code]

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    # Reference branch control baseline. The local nvblox layer publishes fast
    # enough for the same 10 Hz controller deadline.
    costmap_update_timeout: 0.30
    # ControllerServer consumes only the odometry twist here. The bare /odom
    # topic has no publisher, which made every MPPI cycle start from zero and
    # repeatedly reapply only the first 0.1 s acceleration increment. Use the
    # high-rate, calibrated wheel twist; cuVSLAM/cuVGL still exclusively own
    # the map->odom->base_link localization chain.
    odom_topic: /wheel/odometry
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # A single nvblox slice can transiently mark every sampled footprint at a
    # doorway corner. Keep publishing zero for up to one second while fresh
    # ESDF data / MPPI retries arrive instead of immediately entering Spin,
    # which is itself infeasible in the same narrow footprint.
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      required_movement_angle: 0.15
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.174532925
      stateful: true
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 20
      model_dt: 0.10
      batch_size: 500
      iteration_count: 1
      # Retry transient all-collision batches before surfacing a controller
      # exception. Combined with ControllerServer's bounded tolerance above,
      # this waits for a fresh nvblox slice without masking persistent blocks.
      retry_attempt_limit: 1
      ax_max: 1.1
      ax_min: -1.0
      ay_max: 0.0
      ay_min: 0.0
      az_max: 3.0
      vx_std: 0.35
      vy_std: 0.0
      wz_std: 0.80
      vx_max: 0.75
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.20
      prune_distance: 1.5
      transform_tolerance: 0.50
      temperature: 0.30
      gamma: 0.015
      motion_model: DiffDrive
      visualize: true
      # Regenerate each cycle. A fixed distribution repeatedly selected the
      # same left-biased candidate at the north cabinet and produced 181
      # consecutive optimizer failures instead of exploring the narrow set.
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic,
        PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        # Retain the reference obstacle balance. Raising this to 3.0 pushed the
        # whole trajectory away from the right-hand table and into the real
        # cabinet on the left; the narrow passage instead needs exact tracking
        # of the globally centered path.
        cost_weight: 2.0
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 1
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.6
      PathAlignCritic:
        enabled: true
        cost_power: 1
        # A failed north sample tracked x=-0.478 m where the globally centered
        # path was x=-0.45 m; that 3 cm left bias put the physical wheel into
        # the cabinet. Keep alignment above NVIDIA's general baseline, but
        # leave nvblox enough authority to correct the east route away from the
        # same cabinet (weight 20 occasionally locked onto x=-0.521 m).
        cost_weight: 5.0
        # Inflated cells naturally occupy much of this narrow static passage.
        # Keep alignment active; the CostCritic still rejects every lethal
        # full-footprint trajectory supplied by nvblox.
        max_path_occupancy_ratio: 0.40
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        # Match the smooth reference controller inside curves. Rotation Shim
        # owns the longer 0.8 m pre-entry heading check above; using 15 here
        # made MPPI cut across the measured south S-bend.
        offset_from_furthest: 8
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 9.0
        offset_from_furthest: 10
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        # Retain the reference branch's smooth heading response. The longer
        # 15-point / weight-20 diagnostic over-corrected the south S-bend.
        cost_weight: 9.5
        offset_from_furthest: 8
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.45
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 0.30
      footprint: "[[0.255, 0.210], [0.255, -0.210], [-0.230, -0.210], [-0.230, 0.210]]"
      # Keep the reference 5 mm shell. A measured 15 mm diagnostic made every
      # MPPI candidate lethal at the north doorway even though PhysX reported
      # zero contact; safety margin is therefore expressed as a soft critic and
      # command-level slowdown, not by enlarging hard collision geometry.
      footprint_padding: 0.005
      always_send_full_costmap: true
      # Keep the saved eight-stream occupancy map in the global planner. The
      # rolling controller costmap follows NVIDIA's nvblox/Nav2 integration:
      # live ESDF geometry plus inflation. Merging the saved map here made
      # isolated 5 cm mapping speckles lethal a second time inside narrow
      # passages, although the live ESDF and PhysX contact monitor both showed
      # physical clearance. Do not duplicate depth through an ObstacleLayer
      # either: its relayed scan can arrive behind Nav2's TF cache under the
      # six-camera GUI workload. Collision Monitor still consumes the raw scan
      # directly as the final safety layer.
      plugins: [nvblox_layer, inflation_layer]
      nvblox_layer:
        plugin: nvblox::nav2::NvbloxCostmapLayer
        enabled: true
        nav2_costmap_global_frame: odom
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        convert_to_binary_costmap: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.40
        cost_scaling_factor: 8.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.30
      resolution: 0.05
      footprint: "[[0.255, 0.210], [0.255, -0.210], [-0.230, -0.210], [-0.230, 0.210]]"
      # Planning may be conservative without making the live controller's
      # narrow ESDF collision check infeasible. A 15 mm global diagnostic
      # improved the mean but still allowed an x=-0.521 m east-route sample;
      # 25 mm shifts the static grid path across that remaining 2 cm spread.
      # Local padding stays 5 mm above, so the 0.60 m doorway remains feasible.
      footprint_padding: 0.025
      track_unknown_space: true
      always_send_full_costmap: true
      # The offline occupancy map is the authoritative global-planning source.
      # Live nvblox geometry remains local so transient observations cannot
      # poison Smac's global plan or persist as scan/TF ghosts.
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # Match the reference branch. The 0.55/3.0 diagnostic weakened the
        # cost difference between 0.30 m and 0.35 m clearance and moved the
        # measured trajectory farther left, so it is intentionally rejected.
        inflation_radius: 0.40
        cost_scaling_factor: 8.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
      tolerance: 0.10
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # Retain the reference search weighting. Measurements showed that 1.2,
      # 2.0 and 5.0 all selected the same grid column; the global inflation
      # gradient above, rather than this multiplier, determines aisle centring.
      cost_travel_multiplier: 1.2
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        # Reference branch smoothing. A 0.10/0.50 diagnostic produced a sharp
        # grid-column transition and 231 real wheel/cabinet contacts.
        w_smooth: 0.30
        w_data: 0.20
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Navigation is forward-only: no BackUp or translational recovery action
    # is loaded. Recovery may clear costmaps, rotate in place, or wait.
    behavior_plugins: [spin, wait]
    spin:
      plugin: nav2_behaviors::Spin
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.10
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.12
    rotational_acc_lim: 3.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: true
    action_server_result_timeout: 300.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 100

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity: [0.75, 0.0, 1.20]
    min_velocity: [0.0, 0.0, -1.20]
    max_accel: [1.10, 0.0, 3.00]
    max_decel: [-1.00, 0.0, -3.00]
    odom_topic: /wheel/odometry
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.50

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enabled: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_safe
    state_topic: /collision_monitor/state
    transform_tolerance: 0.20
    # Under manual navigation, GUI + RViz bursts can still create bursty scan
    # timing, but long-lagged scans are more dangerous than conservative
    # emergency braking.  Clamp to 0.75 s to avoid steering on stale points.
    source_timeout: 0.75
    # Compensate the raw depth scan for chassis motion between acquisition and
    # collision evaluation, as in the validated reference configuration.
    base_shift_correction: true
    stop_pub_timeout: 0.50
    polygons: [StopZone, SlowdownZone, FootprintApproach]
    StopZone:
      type: polygon
      # Front depth is the independent last-resort guard. Extend only the
      # forward edge (plus 5 mm laterally) so an oblique chair edge stops the
      # robot before the front wheel reaches it without treating parallel
      # narrow-passage walls as a permanent stop.
      points: "[[0.300, 0.235], [0.300, -0.235], [-0.250, -0.235], [-0.250, 0.235]]"
      action_type: stop
      min_points: 2
      visualize: true
      polygon_pub_topic: /collision_monitor/stop_zone
      enabled: true
    SlowdownZone:
      type: polygon
      points: "[[0.420, 0.235], [0.420, -0.235], [-0.350, -0.235], [-0.350, 0.235]]"
      action_type: slowdown
      min_points: 4
      slowdown_ratio: 0.85
      visualize: true
      polygon_pub_topic: /collision_monitor/slowdown_zone
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.0
      simulation_time_step: 0.10
      min_points: 3
      visualize: true
      polygon_pub_topic: /collision_monitor/approach_zone
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /front_depth/scan_raw
      enabled: true
