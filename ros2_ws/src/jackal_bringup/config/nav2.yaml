map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /wheel/odometry
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 5000
    action_server_result_timeout: 300.0
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    error_code_names: [compute_path_error_code, follow_path_error_code, spin_error_code]

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    costmap_update_timeout: 3.0
    # ControllerServer consumes only the odometry twist here. The bare /odom
    # topic has no publisher, which made every MPPI cycle start from zero and
    # repeatedly reapply only the first 0.1 s acceleration increment. Use the
    # high-rate, calibrated wheel twist; cuVSLAM/cuVGL still exclusively own
    # the map->odom->base_link localization chain.
    odom_topic: /wheel/odometry
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.10
      required_movement_angle: 0.15
      movement_time_allowance: 25.0
    goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.174532925
      trans_stopped_velocity: 0.04
      rot_stopped_velocity: 0.06
      stateful: true
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      # A 2.4 s horizon sees the complete doorway approach before the front
      # corner reaches the frame.  The 6 m rolling costmap still contains the
      # full 1.8 m maximum-speed projection with ample TF/map margin.
      time_steps: 24
      model_dt: 0.10
      # The RTX workload is GPU-bound; a moderate CPU-side sample increase is
      # enough to retain turn-in-place and centred doorway candidates without
      # adopting the much heavier 2000 x 56 Carter reference profile.
      batch_size: 750
      iteration_count: 1
      ax_max: 1.1
      ax_min: -1.0
      ay_max: 0.0
      ay_min: 0.0
      az_max: 3.0
      vx_std: 0.35
      vy_std: 0.0
      wz_std: 1.00
      vx_max: 0.75
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.20
      prune_distance: 1.5
      transform_tolerance: 0.50
      temperature: 0.30
      gamma: 0.015
      motion_model: DiffDrive
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: [ConstraintCritic, ObstaclesCritic, GoalCritic, GoalAngleCritic,
        PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      # Follow NVIDIA's nvblox/Carter integration and score actual distance
      # from the rectangular footprint to the obstacle.  CostCritic only made
      # the penalty critical at cost 253, by which point the live failures had
      # already put a Jackal corner in a lethal ESDF cell.
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 30.0
        consider_footprint: true
        collision_cost: 1000000.0
        # Preserve a real 10 cm margin where the passage permits it.  This is
        # a cost, not a hard virtual wall, so a genuinely narrow doorway stays
        # traversable while the centred trajectory wins decisively.
        collision_margin_distance: 0.10
        near_goal_distance: 0.5
        inflation_layer_name: inflation_layer
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        threshold_to_consider: 0.6
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        # Yield to live nvblox geometry once 15% of the local path is occupied;
        # the former 40% threshold kept pulling MPPI into a newly seen corner.
        max_path_occupancy_ratio: 0.15
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 12
        # State Lattice supplies collision-checked orientations, including the
        # rotate-in-place primitive used to square up before a doorway.
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 7.0
        offset_from_furthest: 12
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 7.5
        offset_from_furthest: 12
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.785398
        # Respect the feasible lattice heading instead of cutting diagonally
        # across the next path segment with only a forward preference.
        mode: 2
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 12.0
      publish_frequency: 8.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.30
      footprint: "[[0.255, 0.210], [0.255, -0.210], [-0.230, -0.210], [-0.230, 0.210]]"
      # Match the validated Kujiale reference profile. The footprint already
      # follows the physical wheel envelope; a 30 mm shell made the padded
      # circumscribed radius larger than the measured 0.361 m clearance at a
      # mapped corner and left MPPI with no valid trajectory.
      footprint_padding: 0.005
      track_unknown_space: true
      always_send_full_costmap: true
      # Keep the saved eight-stream occupancy map in the global planner. The
      # rolling controller costmap follows NVIDIA's nvblox/Nav2 integration:
      # live ESDF geometry plus inflation. Merging the saved map here made
      # isolated 5 cm mapping speckles lethal a second time inside narrow
      # passages, although the live ESDF and PhysX contact monitor both showed
      # physical clearance. Do not duplicate depth through an ObstacleLayer
      # either: its relayed scan can arrive behind Nav2's TF cache under the
      # six-camera GUI workload. Collision Monitor still consumes the raw scan
      # directly as the final safety layer.
      plugins: [nvblox_layer, inflation_layer]
      nvblox_layer:
        plugin: nvblox::nav2::NvbloxCostmapLayer
        enabled: true
        nav2_costmap_global_frame: odom
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        convert_to_binary_costmap: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # Build a smooth potential across indoor passages.  The old 0.40 m /
        # 8.0 field provided only about 7 cm beyond the 0.33 m circumscribed
        # radius, so neither planner nor MPPI was warned early enough.
        inflation_radius: 0.55
        cost_scaling_factor: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 4.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.30
      resolution: 0.05
      footprint: "[[0.255, 0.210], [0.255, -0.210], [-0.230, -0.210], [-0.230, 0.210]]"
      footprint_padding: 0.005
      # The visual mapping route leaves small unobserved islands around the
      # robot spawn.  Treat those as globally traversable; the rolling local
      # costmap, combined nvblox ESDF and raw-depth Collision Monitor still
      # provide conservative online obstacle enforcement.
      track_unknown_space: false
      always_send_full_costmap: true
      # The offline occupancy map is the authoritative global-planning source.
      # Live nvblox geometry remains local so transient observations cannot
      # poison Smac's global plan or persist as scan/TF ghosts.
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 5.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0
    planner_plugins: [GridBased]
    GridBased:
      # Jackal is rectangular, so a 2D grid search cannot validate its
      # orientation while turning through a doorway.  The installed 5 cm
      # differential State Lattice checks the complete SE(2) footprint along
      # each primitive and includes pure rotation without requiring reverse.
      plugin: nav2_smac_planner::SmacPlannerLattice
      tolerance: 0.10
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      max_planning_time: 3.0
      lattice_filepath: /opt/ros/jazzy/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json
      cache_obstacle_heuristic: true
      allow_reverse_expansion: false
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.10
      # The upper end of Nav2's documented 1.3--3.5 range strongly favours the
      # centre of passages while retaining a path through unavoidable costs.
      cost_penalty: 3.0
      retrospective_penalty: 0.015
      rotation_penalty: 5.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.5
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      lookup_table_size: 20.0
      debug_visualizations: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.30
        w_data: 0.20
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Navigation is forward-only: no BackUp or translational recovery action
    # is loaded. Recovery may clear costmaps, rotate in place, or wait.
    behavior_plugins: [spin, wait]
    spin:
      plugin: nav2_behaviors::Spin
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.20
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.25
    rotational_acc_lim: 3.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: true
    action_server_result_timeout: 300.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 100

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity: [0.75, 0.0, 1.20]
    min_velocity: [0.0, 0.0, -1.20]
    max_accel: [1.10, 0.0, 3.00]
    max_decel: [-1.00, 0.0, -3.00]
    odom_topic: /wheel/odometry
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.0, 0.01]
    velocity_timeout: 0.25

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enabled: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_safe
    state_topic: /collision_monitor/state
    transform_tolerance: 0.20
    # GUI + RViz measurements show that the 10 Hz simulated depth stream can
    # occasionally reach Collision Monitor about 1.0 simulated second after
    # acquisition while the GPU is shared by cuVSLAM and nvblox.  The source
    # remains motion-compensated below, so allow the measured burst latency
    # plus margin instead of alternating between valid data and forced stops.
    source_timeout: 1.25
    # Compensate the raw depth scan for chassis motion between acquisition and
    # collision evaluation, as in the validated reference configuration.
    base_shift_correction: true
    stop_pub_timeout: 0.50
    polygons: [StopZone, SlowdownZone, FootprintApproach]
    StopZone:
      type: polygon
      points: "[[0.285, 0.230], [0.285, -0.230], [-0.250, -0.230], [-0.250, 0.230]]"
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: /collision_monitor/stop_zone
      enabled: true
    SlowdownZone:
      type: polygon
      points: "[[0.420, 0.235], [0.420, -0.235], [-0.350, -0.235], [-0.350, 0.235]]"
      action_type: slowdown
      min_points: 4
      slowdown_ratio: 0.85
      visualize: true
      polygon_pub_topic: /collision_monitor/slowdown_zone
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.0
      simulation_time_step: 0.05
      min_points: 3
      visualize: true
      polygon_pub_topic: /collision_monitor/approach_zone
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /front_depth/scan_raw
      enabled: true
