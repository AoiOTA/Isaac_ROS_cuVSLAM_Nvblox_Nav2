stage:
  robot_prim: /World/Jackal
  environment_default_prim: /Root
  compose_in_session_layer: true
  save_composed_stage: false
  stage_open_count: 1

spawn_search:
  preferred_xy_m: [2.9, -0.2]
  grid_resolution_m: 0.5
  footprint_clearance_m: 0.05
  height_above_floor_m: 0.0635
  obstacle_height_m: 1.6
  fixed_pose: true
  yaw_deg: 180.0

runtime:
  # Match the proven reference runtime.  Isaac advances the rendered timeline
  # at 60 Hz here, so 120 Hz physics performs two PhysX steps per image frame
  # without increasing the camera cadence.
  physics_hz: 60
  update_hz: 60
  renderer: RealTimePathTracing
  # Isaac Sim 6.0.1 performance-handbook profile. These settings preserve
  # resolution and sensor cadence; only expensive RT2 lighting features are
  # adjusted. DLSS 0 is the documented Performance mode.
  rt2_cached_retrace: 0.1
  fractional_cutout_opacity: false
  dlss_exec_mode: 0
  # The local RTX 4090 has sufficient headroom for the handbook's optional
  # throughput-over-VRAM tradeoff (the full workload uses about 10/24 GiB).
  texture_streaming: false
  resolution: [1280, 720]
  forbid_stage_switching: true
  project_process_lock: data/locks/navigation_sim.lock
