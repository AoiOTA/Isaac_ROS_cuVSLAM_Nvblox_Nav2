defaults:
  name: warehouse_nominal
  seed: 42
  headless: true
  lighting_profile: nominal
  material_profile: original
  dynamic_obstacles: false
  spawn_policy: automatic_collision_free
  goal_policy: automatic_reachable

profiles:
  nominal:
    lighting_scale: 1.0
    color_temperature_k: 5500
  low_light:
    lighting_scale: 0.4
    color_temperature_k: 4000
  bright:
    lighting_scale: 1.5
    color_temperature_k: 6500

static_profiles:
  warehouse_manual_static:
    # These bodies are authored only in the anonymous session layer.  They are
    # collidable and visible to the forward depth camera, but intentionally
    # have no rigid-body motion or trajectory controller.
    obstacles:
      - name: orange_crate
        kind: box
        size_m: [0.42, 0.42, 0.68]
        color_rgb: [0.95, 0.30, 0.08]
        position_m: [0.90, 0.65, 0.34]
      - name: blue_barrel
        kind: capsule
        radius_m: 0.22
        height_m: 0.72
        color_rgb: [0.08, 0.35, 0.95]
        position_m: [1.80, -1.35, 0.36]
      - name: yellow_crate
        kind: box
        size_m: [0.55, 0.32, 0.55]
        color_rgb: [0.95, 0.78, 0.08]
        position_m: [2.80, 0.20, 0.275]

dynamic_profiles:
  warehouse_crossing:
    # The official scene forklift remains an official referenced prim; only
    # session-layer physics/xform overrides are authored at runtime.
    obstacles:
      - name: official_forklift
        kind: existing_forklift
        prim_path: /World/Forklift
        waypoints_m:
          - [3.6404345, -1.9916162, 0.0]
          - [3.6404345, -0.7416162, 0.0]
        period_s: 18.0
        phase: 0.0
        yaw_deg: -58.0
        yield_distance_m: 2.0
      - name: crossing_box
        kind: box
        size_m: [0.26, 0.30, 0.55]
        color_rgb: [0.95, 0.22, 0.08]
        waypoints_relative_spawn_m:
          # Keep the body inside both routes' dynamic-inflation envelope, but
          # outside the physical swept footprint. A kinematic actor must not
          # be allowed to ram a correctly stopped robot from the side.
          - [1.40, 1.05, 0.275]
          - [1.40, 1.25, 0.275]
        period_s: 10.0
        phase: 0.15
        # The short crossing route can clear about 0.85 m from the nominal
        # navigation corridor. Trigger at 0.80 m, then retreat to the farther
        # endpoint and hold there until the robot has genuinely cleared the
        # crossing. The wider release hysteresis prevents rapid yield/re-enter
        # oscillation from starving Nav2 progress. Collision Monitor still
        # owns the robot-side slow/stop envelope.
        yield_distance_m: 0.80
        yield_release_margin_m: 0.30
        # Dedicated world refuge=(0.9, 2.7, 0.305) for the fixed spawn. The
        # occupancy map is free along this retreat and at the refuge. It is
        # clear of both the y=0 and y=1.5 acceptance corridors.
        yield_refuge_relative_spawn_m: [1.40, 3.20, 0.275]
        yield_speed_mps: 0.75
      - name: crossing_capsule
        kind: capsule
        radius_m: 0.16
        height_m: 0.60
        color_rgb: [0.10, 0.45, 0.95]
        waypoints_relative_spawn_m:
          - [2.30, -0.55, 0.46]
          - [2.30, -1.30, 0.46]
        period_s: 12.0
        phase: 0.55
        yield_distance_m: 1.05
        yield_release_margin_m: 0.08
