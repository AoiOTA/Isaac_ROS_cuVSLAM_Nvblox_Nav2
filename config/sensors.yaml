lidar_enabled: false

front_stereo:
  left_camera_prim: /World/Jackal/base_link/sensors/front_hawk/left/camera_left
  right_camera_prim: /World/Jackal/base_link/sensors/front_hawk/right/camera_right
  imu_prim: /World/Jackal/base_link/sensors/front_hawk/Imu/Imu_Sensor
  image_width: 1280
  image_height: 800
  depth_width: 640
  depth_height: 400
  # The Hawk is mounted over the middle of the chassis.  Reject geometry
  # closer than the Jackal body before the native depth render reaches
  # nvblox; otherwise the static TSDF records a black "robot trail".
  depth_min_range_m: 0.40
  image_rate_hz: 10.0
  imu_rate_hz: 120.0
  # Isaac Sim 6.0.1 publishes zero distortion in CameraInfo for the legacy
  # fisheyePolynomial Hawk projection. Render the navigation pair as pinhole
  # in the anonymous session layer so rectified_images=true is truthful.
  navigation_projection: pinhole

# Mapping authors all four Hawk pairs. Navigation authors front/left/right and
# deliberately creates no rear render products or ROS publishers.
surround_stereo:
  # cuVSLAM 15 rejects a saved multicamera rig when camera resolutions differ.
  # Keep one resolution for the saved eight-camera calibration. Mapping uses
  # all eight streams; navigation publishes front/left/right and does not even
  # create render products for the two rear streams.
  image_width: 1280
  image_height: 800
  image_rate_hz: 10.0
  navigation_projection: pinhole
  cameras:
    left:
      left_camera_prim: /World/Jackal/base_link/sensors/left_hawk/left/camera_left
      right_camera_prim: /World/Jackal/base_link/sensors/left_hawk/right/camera_right
    right:
      left_camera_prim: /World/Jackal/base_link/sensors/right_hawk/left/camera_left
      right_camera_prim: /World/Jackal/base_link/sensors/right_hawk/right/camera_right
    back:
      left_camera_prim: /World/Jackal/base_link/sensors/back_hawk/left/camera_left
      right_camera_prim: /World/Jackal/base_link/sensors/back_hawk/right/camera_right

topics:
  left_rgb_raw: /front_stereo_camera/left/image_raw_rgb
  right_rgb_raw: /front_stereo_camera/right/image_raw_rgb
  left_mono: /front_stereo_camera/left/image_raw
  right_mono: /front_stereo_camera/right/image_raw
  left_camera_info: /front_stereo_camera/left/camera_info
  right_camera_info: /front_stereo_camera/right/camera_info
  depth: /front_stereo_camera/depth/image_raw
  depth_camera_info: /front_stereo_camera/depth/camera_info
  imu: /front_stereo_imu/imu
  left_left_rgb_raw: /left_stereo_camera/left/image_raw_rgb
  left_right_rgb_raw: /left_stereo_camera/right/image_raw_rgb
  left_left_mono: /left_stereo_camera/left/image_raw
  left_right_mono: /left_stereo_camera/right/image_raw
  left_left_camera_info: /left_stereo_camera/left/camera_info
  left_right_camera_info: /left_stereo_camera/right/camera_info
  right_left_rgb_raw: /right_stereo_camera/left/image_raw_rgb
  right_right_rgb_raw: /right_stereo_camera/right/image_raw_rgb
  right_left_mono: /right_stereo_camera/left/image_raw
  right_right_mono: /right_stereo_camera/right/image_raw
  right_left_camera_info: /right_stereo_camera/left/camera_info
  right_right_camera_info: /right_stereo_camera/right/camera_info
  back_left_rgb_raw: /back_stereo_camera/left/image_raw_rgb
  back_right_rgb_raw: /back_stereo_camera/right/image_raw_rgb
  back_left_mono: /back_stereo_camera/left/image_raw
  back_right_mono: /back_stereo_camera/right/image_raw
  back_left_camera_info: /back_stereo_camera/left/camera_info
  back_right_camera_info: /back_stereo_camera/right/camera_info

frames:
  base: base_link
  camera_link: front_stereo_camera_link
  left_optical: front_stereo_camera_left_optical
  right_optical: front_stereo_camera_right_optical
  imu: front_stereo_camera_imu
  left_camera_link: left_stereo_camera_link
  left_left_optical: left_stereo_camera_left_optical
  left_right_optical: left_stereo_camera_right_optical
  right_camera_link: right_stereo_camera_link
  right_left_optical: right_stereo_camera_left_optical
  right_right_optical: right_stereo_camera_right_optical
  back_camera_link: back_stereo_camera_link
  back_left_optical: back_stereo_camera_left_optical
  back_right_optical: back_stereo_camera_right_optical

extrinsics:
  camera_link_xyz_m: [0.0, 0.0, 0.42]
  camera_link_yaw_rad: 0.0
  left_from_camera_link_xyz_m: [0.0, 0.075, 0.0]
  right_from_camera_link_xyz_m: [0.0, -0.075, 0.0]
  optical_rpy_rad: [-1.5707963267948966, 0.0, -1.5707963267948966]
  imu_from_camera_link_xyz_m: [0.0, 0.075, 0.0]
  imu_from_camera_link_rpy_rad: [0.0, 0.0, 0.0]
  stereo_baseline_m: 0.15
  # Cardinal stereo-pair midpoints relative to base_link.
  left_camera_link_xyz_m: [0.0, 0.0, 0.42]
  left_camera_link_yaw_rad: 1.5707963267948966
  right_camera_link_xyz_m: [0.0, 0.0, 0.42]
  right_camera_link_yaw_rad: -1.5707963267948966
  back_camera_link_xyz_m: [0.0, 0.0, 0.42]
  back_camera_link_yaw_rad: 3.141592653589793
